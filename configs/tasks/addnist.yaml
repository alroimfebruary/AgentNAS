name: addnist
data_dir: AddNIST
input_shape: [3, 28, 28]
num_classes: 20
loss: cross_entropy
metric: accuracy              # 1 - accuracy (lower=better)
lower_is_better: true
sota_metric: 0.0209           # SOTA 1-accuracy = 0.0209 (accuracy 97.91%)
sota_description: "SOTA 1-accuracy = 0.0209 (accuracy 97.91%)"
