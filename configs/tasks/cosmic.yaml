name: cosmic
data_dir: cosmic
input_shape: [1, 128, 128]
output_shape: [1, 128, 128]
loss: bce_with_logits          # with ignore mask
metric: auroc                  # 1 - AUROC (lower=better)
lower_is_better: true
sota_metric: 0.127             # SOTA 1-AUROC = 0.127 (AUROC 0.873)
sota_description: "SOTA 1-AUROC = 0.127 (AUROC = 0.873)"
