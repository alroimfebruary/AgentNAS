name: fsd50k
data_dir: fsd50k
input_shape: [1, 96, 101]    # mel-spectrogram: (1, n_mels=96, time=101) — matches official
num_classes: 200
loss: bce_with_logits
metric: map                   # 1 - mAP (lower=better)
lower_is_better: true
sota_metric: 0.62             # Human SOTA: mAP 0.38 → 1-mAP = 0.62
sota_description: "Human SOTA 1-mAP = 0.62 (mAP = 0.38). Random baseline ~0.99."
