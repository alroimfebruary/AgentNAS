name: deepsea
data_dir: deepsea
input_shape: [4, 1000]
num_classes: 36
loss: bce_with_logits
metric: auroc                 # 1 - mean AUROC (lower=better)
lower_is_better: true
sota_metric: 0.30             # SOTA 1-AUROC = 0.30 (AUROC 0.70)
sota_description: "SOTA 1-AUROC = 0.30 (mean per-class AUROC = 0.70)"
